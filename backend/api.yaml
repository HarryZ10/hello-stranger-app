openapi: 3.0.3
info:
  title: MLH Project API
  version: 1.0.0
  description: API documentation for MLH Project
paths:
  /api/activities/:
    get:
      operationId: activities_list
      description: List activities or create a new one
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityListList'
          description: ''
    post:
      operationId: activities_create
      description: List activities or create a new one
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCreate'
          description: ''
  /api/activities/{activity_id}/checkin/:
    post:
      operationId: activities_checkin_create
      description: Check in to an activity
      parameters:
      - in: path
        name: activity_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/{activity_id}/comments/:
    get:
      operationId: activities_comments_list
      description: List and create comments on an activity
      parameters:
      - in: path
        name: activity_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityCommentList'
          description: ''
    post:
      operationId: activities_comments_create
      description: List and create comments on an activity
      parameters:
      - in: path
        name: activity_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCommentRequest'
          application/x-www-form-urlencoded:
