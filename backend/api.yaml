  /api/activities/{id}/:
    get:
      operationId: activities_retrieve
      description: Get, update, or delete an activity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetail'
          description: ''
    put:
      operationId: activities_update
      description: Get, update, or delete an activity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCreate'
          description: ''
    patch:
      operationId: activities_partial_update
      description: Get, update, or delete an activity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCreate'
          description: ''
    delete:
      operationId: activities_destroy
      description: Get, update, or delete an activity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
